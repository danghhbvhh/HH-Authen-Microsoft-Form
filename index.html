<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <!-- Hạn chế cache -->
    <meta http-equiv="Cache-Control"
          content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bài khảo sát - BVĐK Hưng Hà</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f1f4f8;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px 30px;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 25px;
            color: #000;
        }

        h2 {
            margin: 0 0 30px;

            font-size: 20px;
            color: #444;
        }

        .description {
            text-align: left;

            margin-bottom: 15px;

            font-size: 16px;
        }

        input {
            width: 100%;

            padding: 16px;

            font-size: 18px;

            border: 1px solid #aaa;
            border-radius: 8px;

            outline: none;

            margin-bottom: 15px;
        }

        input:focus {
            border-color: #2f7bdc;
        }

        button {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 8px;

            background: #2f7bdc;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #2568bd;
        }

        #thongbao {
            min-height: 24px;

            margin-top: 15px;

            font-size: 15px;
            font-weight: bold;
        }

        .loi {
            color: #d93025;
        }

        .dung {
            color: #188038;
        }

        #thoigian {
            margin-top: 20px;

            font-size: 15px;
            font-weight: bold;

            color: #444;
        }

        .timezone {
            margin-top: 5px;

            font-size: 13px;

            color: #777;
        }


        /* ==============================
           KHU VỰC QR
        ============================== */

        #qrBox {
            display: none;
        }

        #qrBox h2 {
            margin-bottom: 10px;

            color: #188038;
        }

        #qrBox p {
            font-size: 16px;

            line-height: 1.5;

            color: #444;
        }

        #qrBox img {
            display: block;

            width: 100%;
            max-width: 430px;

            margin: 20px auto;

            border-radius: 12px;
        }

        .qr-note {
            font-size: 14px !important;

            color: #777 !important;
        }


        /* ==============================
           ĐIỆN THOẠI
        ============================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 21px;
            }

            h2 {
                font-size: 17px;
            }

            #qrBox img {
                max-width: 100%;
            }
        }
    </style>
</head>


<body>

<div class="container">


    <!-- ==============================
         MÀN HÌNH NHẬP MẬT KHẨU
    ============================== -->

    <div id="loginBox">

        <h1>
            BỆNH VIỆN ĐA KHOA HƯNG HÀ
        </h1>

        <h2>
            BÀI KHẢO SÁT NHÂN VIÊN VỀ ACHS
        </h2>


        <div class="description">
            Vui lòng nhập mật khẩu để bắt đầu bài khảo sát
        </div>


        <input
            type="password"
            id="matkhau"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="10"
            placeholder="Nhập mật khẩu"
            autocomplete="off"
        >


        <button onclick="kiemTraMatKhau()">
            BẮT ĐẦU KHẢO SÁT
        </button>


        <div id="thongbao"></div>


        <div id="thoigian"></div>

        <div class="timezone">
            Giờ Việt Nam
        </div>

    </div>



    <!-- ==============================
         MÀN HÌNH QR
    ============================== -->

    <div id="qrBox">

        <h1>
            BỆNH VIỆN ĐA KHOA HƯNG HÀ
        </h1>

        <h2>
            MÃ QR BÀI KHẢO SÁT
        </h2>


        <p>
            Xác thực thành công.
            Vui lòng quét mã QR bên dưới để thực hiện bài khảo sát.
        </p>


        <img
            src="qr.jpg"
            alt="Mã QR bài khảo sát ACHS"
        >


        <p class="qr-note">
            Mã QR chỉ được hiển thị sau khi nhập đúng mật khẩu.
        </p>

    </div>

</div>



<script>

    /*
    ============================================================
        CẤU HÌNH MẬT KHẨU
    ============================================================

        07:00 - 12:00  → 1111

        13:30 - 14:30  → 1510

        14:31 - 15:30  → 0001

        15:31 - 16:30  → 8386

    ============================================================
    */


    function layGioVietNam() {

        const formatter =
            new Intl.DateTimeFormat(
                "en-GB",
                {
                    timeZone: "Asia/Ho_Chi_Minh",

                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",

                    hour12: false
                }
            );


        const parts =
            formatter.formatToParts(
                new Date()
            );


        let gio = 0;
        let phut = 0;
        let giay = 0;


        for (const part of parts) {

            if (part.type === "hour") {
                gio = parseInt(part.value);
            }

            if (part.type === "minute") {
                phut = parseInt(part.value);
            }

            if (part.type === "second") {
                giay = parseInt(part.value);
            }
        }


        return {
            gio: gio,
            phut: phut,
            giay: giay
        };
    }



    /*
    ============================================================
        XÁC ĐỊNH MẬT KHẨU THEO KHUNG GIỜ
    ============================================================
    */

    function layMatKhauTheoGio() {

        const thoiGian =
            layGioVietNam();


        const tongPhut =
            thoiGian.gio * 60
            +
            thoiGian.phut;



        /*
        --------------------------------------------------------
            KHUNG 1

            07:00 - 12:00

            Mật khẩu: 1111
        --------------------------------------------------------
        */

        if (
            tongPhut >= (7 * 60)
            &&
            tongPhut <= (12 * 60)
        ) {

            return "1111";
        }



        /*
        --------------------------------------------------------
            KHUNG 2

            13:30 - 14:30

            Mật khẩu: 1510
        --------------------------------------------------------
        */

        else if (
            tongPhut >= (13 * 60 + 30)
            &&
            tongPhut <= (14 * 60 + 30)
        ) {

            return "1510";
        }



        /*
        --------------------------------------------------------
            KHUNG 3

            14:31 - 15:30

            Mật khẩu: 0001
        --------------------------------------------------------
        */

        else if (
            tongPhut >= (14 * 60 + 31)
            &&
            tongPhut <= (15 * 60 + 30)
        ) {

            return "0001";
        }



        /*
        --------------------------------------------------------
            KHUNG 4

            15:31 - 16:30

            Mật khẩu: 8386
        --------------------------------------------------------
        */

        else if (
            tongPhut >= (15 * 60 + 31)
            &&
            tongPhut <= (16 * 60 + 30)
        ) {

            return "8386";
        }



        /*
        --------------------------------------------------------
            NGOÀI KHUNG GIỜ
        --------------------------------------------------------
        */

        return null;
    }



    /*
    ============================================================
        KIỂM TRA MẬT KHẨU
    ============================================================
    */

    function kiemTraMatKhau() {

        const input =
            document.getElementById("matkhau");


        const thongBao =
            document.getElementById("thongbao");


        const matKhauNhap =
            input.value.trim();


        const matKhauDung =
            layMatKhauTheoGio();



        /*
            Chưa nhập mật khẩu
        */

        if (matKhauNhap === "") {

            thongBao.className = "loi";

            thongBao.innerText =
                "Vui lòng nhập mật khẩu.";

            return;
        }



        /*
            Ngoài thời gian khảo sát
        */

        if (matKhauDung === null) {

            thongBao.className = "loi";

            thongBao.innerText =
                "Hiện không nằm trong thời gian thực hiện khảo sát.";

            input.value = "";

            return;
        }



        /*
            Mật khẩu chính xác
        */

        if (matKhauNhap === matKhauDung) {

            thongBao.className = "dung";

            thongBao.innerText =
                "Xác thực thành công.";


            /*
                Sau 300ms sẽ ẩn màn hình đăng nhập
                và hiện QR
            */

            setTimeout(
                function () {

                    document
                        .getElementById("loginBox")
                        .style
                        .display = "none";


                    document
                        .getElementById("qrBox")
                        .style
                        .display = "block";

                },
                300
            );

        }


        /*
            Sai mật khẩu
        */

        else {

            thongBao.className = "loi";

            thongBao.innerText =
                "Mật khẩu không chính xác.";

            input.value = "";

            input.focus();
        }
    }



    /*
    ============================================================
        HIỂN THỊ ĐỒNG HỒ
    ============================================================
    */

    function hienThiThoiGian() {

        const thoiGian =
            layGioVietNam();


        const gio =
            String(
                thoiGian.gio
            ).padStart(
                2,
                "0"
            );


        const phut =
            String(
                thoiGian.phut
            ).padStart(
                2,
                "0"
            );


        const giay =
            String(
                thoiGian.giay
            ).padStart(
                2,
                "0"
            );


        document
            .getElementById("thoigian")
            .innerText =
                "Thời gian hiện tại: "
                +
                gio
                +
                ":"
                +
                phut
                +
                ":"
                +
                giay;
    }



    /*
    ============================================================
        NHẤN ENTER ĐỂ XÁC NHẬN
    ============================================================
    */

    document
        .getElementById("matkhau")
        .addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    kiemTraMatKhau();
                }
            }
        );



    /*
    ============================================================
        KHỞI ĐỘNG ĐỒNG HỒ
    ============================================================
    */

    hienThiThoiGian();


    setInterval(
        hienThiThoiGian,
        1000
    );

</script>

</body>

</html>
