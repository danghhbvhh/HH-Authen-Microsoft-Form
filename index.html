<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài khảo sát - BVĐK Hưng Hà</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f2f5f8;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 10px;
        }

        h2 {
            font-size: 18px;
            margin: 0 0 30px;
            color: #444;
        }

        .description {
            font-size: 16px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #aaa;
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border: 2px solid #0078d4;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #0078d4;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #006cbd;
        }

        #thongbao {
            min-height: 22px;
            margin-top: 15px;
            color: #d00000;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BỆNH VIỆN ĐA KHOA HƯNG HÀ</h1>

    <h2>BÀI KHẢO SÁT NHÂN VIÊN VỀ ACHS</h2>

    <p class="description">
        Vui lòng nhập mật khẩu để bắt đầu bài khảo sát
    </p>

    <input
        type="password"
        id="password"
        placeholder="Nhập mật khẩu"
        autocomplete="off"
    >

    <button onclick="kiemTraMatKhau()">
        BẮT ĐẦU KHẢO SÁT
    </button>

    <div id="thongbao"></div>

</div>

<script>
// LINK MICROSOFT FORMS
// GIỮ NGUYÊN LINK FORM HIỆN TẠI CỦA BẠN
const LINK_FORM = "LINK_MICROSOFT_FORMS_CUA_BAN";


function kiemTraMatKhau() {

    const matKhauNhap =
        document.getElementById("password").value;

    // Lấy thời gian hiện tại
    const bayGio = new Date();

    const gio = bayGio.getHours();
    const phut = bayGio.getMinutes();

    // Quy đổi thành tổng số phút trong ngày
    const tongPhut = gio * 60 + phut;

    let matKhauDung = null;

    // 13:30 - 14:30
    if (tongPhut >= 13 * 60 + 30 &&
        tongPhut <= 14 * 60 + 30) {

        matKhauDung = "1510";
    }

    // 14:31 - 15:30
    else if (tongPhut >= 14 * 60 + 31 &&
             tongPhut <= 15 * 60 + 30) {

        matKhauDung = "0000";
    }

    // 15:31 - 16:30
    else if (tongPhut >= 15 * 60 + 31 &&
             tongPhut <= 16 * 60 + 30) {

        matKhauDung = "8386";
    }

    // Ngoài giờ thi
    else {

        document.getElementById("thongbao").innerText =
            "Hiện không nằm trong thời gian làm bài.";

        return;
    }


    // Kiểm tra mật khẩu
    if (matKhauNhap === matKhauDung) {

        window.location.href = LINK_FORM;

    } else {

        document.getElementById("thongbao").innerText =
            "Mật khẩu không chính xác!";

        document.getElementById("password").value = "";

        document.getElementById("password").focus();
    }
}


// Nhấn Enter để xác nhận
document.getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            kiemTraMatKhau();
        }

    });
</script>

</body>
</html>
